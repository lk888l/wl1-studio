[package]
name = "wl1-studio"
version = "0.1.0"
description = "WL1 轮腿机器人调参与个性化设置上位机"
authors = ["WL1 Studio Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "wl1_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pc-monitor-core = { path = "crates/pc-monitor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "~2.5.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
getrandom = "0.4"
probe-rs = { version = "=0.32.0", path = "vendor/probe-rs", default-features = false, features = ["builtin-targets"] }
ihex = "3"
object = { version = "0.40", default-features = false, features = ["elf", "read_core", "std"] }
sha2 = "0.11"
base64 = "0.23"
btleplug = "0.13.2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
pc-monitor-windows = { path = "crates/pc-monitor-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
members = ["crates/pc-monitor-core", "crates/pc-monitor-windows"]
exclude = ["vendor/probe-rs"]
resolver = "2"
