[package]
name = "wl1-studio"
version = "0.1.0"
description = "WL1 轮腿机器人调参与个性化设置上位机"
authors = ["WL1 Studio Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "wl1_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tauri = { version = "2", features = [] }
probe-rs = { version = "=0.32.0", default-features = false, features = ["builtin-targets"] }
ihex = "3"
object = { version = "0.39", default-features = false, features = ["elf", "read_core", "std"] }
sha2 = "0.10"
base64 = "0.22"
btleplug = "0.13.2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
