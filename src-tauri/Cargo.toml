[package]
name = "wl1-studio"
version = "0.1.0"
description = "WL1 轮腿机器人调参与个性化设置上位机"
authors = ["WL1 Studio Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "wl1_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tauri = { version = "2", features = [] }
